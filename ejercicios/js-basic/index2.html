<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .error{color: red;}
        .ok{color: green;}
    </style>
</head>
<body>
    <div id="caixa"><p>paràgrafs</p></div>
    <button id="boto1">boton1</button>
    <input type="text" id="texte">
    <div id="preview"></div>
    <div id="contenidor"></div>
    <button id="afegir">Afegir Linea</button>
    <input type="text" id="usuari">
    <button id="validar">Validar</button>
    <div id="avis"></div>
    <button id="dies">Dias</button>
    <ol id="llistaordenada"></ol>
    <button id="productes">Productes</button>
    <div id="taulaproductes"></div>
    <select name="" id="opcio">
        <option value="A">A</option>
        <option value="B">B</option>
    </select>
    <div id="descripcio"></div>
    <hr>
    <input type="checkbox" name="" id="fruta" value="fruta">Fruita
    <input type="checkbox" name="" id="verdura" value="vedura">Verdura
    <input type="checkbox" name="" id="leche" value="leche">Làctics
    <ul id="seleccionats"></ul>
    <script>
        // 21
        let caixa = document.querySelector("#caixa")
        let boto1 = document.querySelector("#boto1")

        boto1.addEventListener("click", () => {caixa.innerHTML = `<p>Primer paràgraf</p><p>Segon paràgraf</p>`})
        // 22
        console.log(caixa.innerHTML)
        // 23
        let inputt = document.querySelector("#texte")
        let preview = document.querySelector("#preview")

        inputt.addEventListener("input", () => {preview.innerHTML = `<strong> ${inputt.value} </strong>`})
        // 24
        let contenidor = document.querySelector("#contenidor")
        let afl = document.querySelector("#afegir")

        afl.addEventListener("click", () => {contenidor.innerHTML += `<p>Nova línia ${new Date()} </p>`})
        // 25
        let inputv = document.querySelector("#usuari")
        let validar = document.querySelector("#validar")
        let divavi = document.querySelector("#avis")
        function error(){
            if (inputv.value.trim() ===""){
                divavi.innerHTML = `<span class="error">El camp és obligatori</span>`
            } else{
                divavi.innerHTML = `<span class="ok">Correcte</span>`
            }
        }

        validar.addEventListener("click", error)
        // 26
        let dies = ["Dilluns", "Dimarts", "Dimecres"]
        let buttondies = document.querySelector("#dies")
        let llistaordenada = document.querySelector("#llistaordenada")
        function llista(){
            let html = ""
            for(let i=0;i<dies.length;i++){
                html += `<li> ${dies[i]}</li>`
            }
            llistaordenada.innerHTML = html
        }
        buttondies.addEventListener("click", llista)
        // 27
        let productes = [["Poma", "1.2"], ["Llet", "0.9"]]
        let bototabla = document.querySelector("#productes")
        let taulaproductes = document.querySelector("#taulaproductes")
        function tabla(){
            let htmlTaula = ""
            for(let i=0;i<productes.length;i++){
                htmlTaula += `
                    <tr><td>${productes[i][0]}</td><td>${productes[i][1]}</td></tr>
                    `
            }
            taulaproductes.innerHTML = `<table>${htmlTaula}</table>`
        }
        bototabla.addEventListener("click", tabla)
        // 28
        let selectopt = document.querySelector("#opcio")
        let descripcio = document.querySelector("#descripcio")

        selectopt.addEventListener("change", () => {descripcio.innerHTML = `<h3> Títol ${selectopt.value} </h3> <p>Text ${selectopt.value}</p>`})
        // 29
        let fruta = document.querySelector("#fruta")
        let verdura = document.querySelector("#verdura")
        let leche = document.querySelector("#leche")
        let seleccionadosul = document.querySelector("#seleccionats");
        fruta.addEventListener("change")
    </script>
</body>
</html>
