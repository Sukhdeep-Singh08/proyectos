<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .error{color:red;}
        .feta { text-decoration: line-through; color: #666; }
    </style>
</head>
<body>
    <form action="" id="form">
        <input type="text" id="nom">
        <input type="number" id="preu">
        <input type="text" id="descripcio">
        <button type="submit">Submit</button>
    </form>
    <hr>
    <form action="" id="form2">
        <input type="text" id="tasca">
        <button type="submit">Envia</button>
    </form>
    <div id="html">
    </div>
    <ul id="llistaTasques"></ul>
    <span id="total"></span>
    <div id="errors"></div>
    <hr>
    <form action="" id="form3">
        <input type="text" id="titol">
        <input type="date" name="" id="date">
        <input type="text" id="lloc">
        <button type="submit">Submit</button>
    </form>
    <div id="form3result"></div>
    <hr>
    <form action="" id="form4">
        <input type="text" id="llibretitol">
        <input type="text" id="autor">
        <input type="number" name="" id="any">
        <button id="submit">Submit</button>
    </form>
    <div id="llibres">

    </div>
    <hr>
    <form action="" id="form5">
        <input type="text" id="tascatitol">
        <button type="submit">Submit</button>
    </form>
    <ul id="llistaTasca"></ul>
    <script>
        // 21
        let alumnes = [ {nom:"Anna",nota:8},{nom:"Joan",nota: 6}];
        function renderitzarAlumnes(){
            let html = "";
            for(let i = 0;i<alumnes.length;i++){
                html += `<tr><td>${alumnes[i].nom}</td><td>${alumnes[i].nota}</td></tr>`
            }
            document.querySelector("#html").innerHTML= `<table>
                <thead>
                    <tr>
                        <th>Nom</td>
                        <th>Nota</td>
                    </tr>
                </thead>    
                <tbody>
                    ${html}
                </tbody>
            </table>`
        }
        renderitzarAlumnes()
        // 24
        let productes = []
        let form = document.querySelector("#form")
        let nom = document.querySelector("#nom")
        let preu = document.querySelector("#preu")
        let descripcio = document.querySelector("#descripcio")

        form.addEventListener("submit", function(e){
            e.preventDefault();
            if(nom.value.trim()==="" || preu.value.trim()===""){
                alert("Omple els camps buits");
                return
            } else{
                if(descripcio.value.trim() === ""){
                    descripcio.value = "—"
                }
                productes.push({nom:nom.value,preu:preu.value,descripcio:descripcio.value})
            }
            renderitzarProductes()  
            form.reset()          
        })

        function renderitzarProductes(){
            let html2 = "";
            for(let i = 0;i<productes.length;i++){
                html2 += `<div class="productes"><p>Nom: ${productes[i].nom}</p><p>Preu: ${productes[i].preu}</p><p>descripcio: ${productes[i].descripcio}</p></div>`
            }
            html.innerHTML = html2
        }
        // 25 -26
        let tasques = [];
        let form2 = document.querySelector("#form2");
        let tascaTitol = document.querySelector("#tasca");
        let lliscaTasques = document.querySelector("#llistaTasques")
        let divErrors = document.querySelector("#errors")
        form2.addEventListener("submit",function(e){
            e.preventDefault();
            if(tascaTitol.value.trim() === ""){
                divErrors.innerHTML = `<p class="error">Si us plau, omple tots els camps obligatoris.</p>`
                return;
            } else {
                divErrors.innerHTML = ""
                tasques.push({titol: tascaTitol.value})
            }
            console.log(tasques)
            listaActualitzar();
            form2.reset()
        })
        function listaActualitzar(){
            let html3 = "";
            for (let i = 0; i <tasques.length; i++) {
                html3 += `<li>${tasques[i].titol}</li>`;               
            };
            lliscaTasques.innerHTML = html3;
            document.querySelector("#total").textContent = `Total: ${tasques.length} tasques`
        }
    // 27
    let esdeveniments = []
        let form3 = document.querySelector("#form3")
        let titol = document.querySelector("#titol")
        let date = document.querySelector("#date")
        let lloc = document.querySelector("#lloc")

        form3.addEventListener("submit",function(e){
            e.preventDefault();
            if(titol.value.trim() === "" || date.value.trim() === "" || lloc.value.trim() === ""){
                alert("omple els camps buits");
                return;
            } else {
                esdeveniments.push({Titol: titol.value, Data: date.value, Lloc: lloc.value});
                console.log(esdeveniments)
            };
            renderitzarLlista();
        })

        function renderitzarLlista(){
            let html4 = ""
            for(let i = 0;i<esdeveniments.length;i++){
                html4 += `
                <article>Titol : ${esdeveniments[i].Titol} Data: ${esdeveniments[i].Data} Lloc: ${esdeveniments[i].Lloc}</article>`
            }
            document.querySelector("#form3result").innerHTML = html4
        }
        // 29
        let llibres = [];
        let llibreTitol = document.querySelector("#llibretitol");
        let autor = document.querySelector("#autor");
        let any = document.querySelector("#any");
        let form4 = document.querySelector("#form4")
        let divLlibres = document.querySelector("#llibres")
        form4.addEventListener("submit", function(e){
            e.preventDefault();
            if(llibreTitol.value.trim() ==="" || autor.value.trim() === "" || any.value.trim() ===""){
                alert("omple els camps buits")
                return;
            }else{
                llibres.push({titol: llibreTitol.value, autor: autor.value, any: any.value})
            }
            renderitzarLlibres();
            form4.reset();
        })
        function renderitzarLlibres(){
            let html5 = "";
            for(let i = 0; i<llibres.length;i++){
                html5 += `<div class="llibre">
                    <strong>${llibres[i].titol}</strong> — ${llibres[i].autor} (${llibres[i].any})
                </div>` 
            }
            divLlibres.innerHTML = html5
        }
        renderitzarLlibres()
        // 30
        let tasques2 = []
        let tascatitol = document.querySelector("#tascatitol");
        let form5 = document.querySelector("#form5")
        
        form5.addEventListener("submit", function(e){
            e.preventDefault()
            if(tascatitol.value.trim() === ""){
                alert("Omple els camps en buit");
                return;
            } else{
                tasques2.push({titol: tascatitol.value, completada: false});
            };
            renderitzarTasques();
            form5.reset()
        })

        function renderitzarTasques(){
            let html6 = ""
            for(let i = 0;i<tasques2.length;i++){
                if(tasques2[i].completada === false){
                    html6 += `<li class="pendent">${tasques2[i].titol}</li>`
                } else {
                    html6 += `<li class="feta">${tasques2[i].titol}</li>`                    
                }
            }
            document.querySelector("#llistaTasca").innerHTML = html6
        }
    </script>
</body>
</html>
