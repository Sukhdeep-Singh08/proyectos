<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .error{color: red;}
        .ok{color: green;}
        .destacat{color: aquamarine;}
    </style>
</head>
<body>
    <div id="caixa"><p>paràgrafs</p></div>
    <button id="boto1">boton1</button>
    <input type="text" id="texte">
    <div id="preview"></div>
    <div id="contenidor"></div>
    <button id="afegir">Afegir Linea</button>
    <input type="text" id="usuari">
    <button id="validar">Validar</button>
    <div id="avis"></div>
    <button id="dies">Dias</button>
    <ol id="llistaordenada"></ol>
    <button id="productes">Productes</button>
    <div id="taulaproductes"></div>
    <select name="" id="opcio">
        <option value="A">A</option>
        <option value="B">B</option>
    </select>
    <div id="descripcio"></div>
    <hr>
    <input type="checkbox" name="" id="fruta" value="fruta">Fruita
    <input type="checkbox" name="" id="verdura" value="vedura">Verdura
    <input type="checkbox" name="" id="leche" value="leche">Làctics
    <ul id="seleccionats"></ul>
    <button id="incrementar">incrementar</button>
    <div id="comptador"></div>
    <button id="hora1">Quina hora és?</button>
    <p id="hora"></p>
    <hr>
    <div id="contingutAlternat">Estat A</div>
    <button id="boto4">boto4</button>
    <hr>
    <input type="text" id="nom3">
    <input type="text" id="cognom">
    <button id="crearfitxa">crearfitxa</button>
    <div id="fitxa"></div>
    <hr>
    <input type="text" id="item">
    <button id="afegir2">Afegir</button>
    <button id="netejar2">Netejar</button>
    <ul id="llistaitems"></ul>
    <hr>
    <div id="target">Contingut</div>
    <button id="target-button">button</button>
    <script>
        // 21
        let caixa = document.querySelector("#caixa")
        let boto1 = document.querySelector("#boto1")

        boto1.addEventListener("click", () => {caixa.innerHTML = `<p>Primer paràgraf</p><p>Segon paràgraf</p>`})
        // 22
        console.log(caixa.innerHTML)
        // 23
        let inputt = document.querySelector("#texte")
        let preview = document.querySelector("#preview")

        inputt.addEventListener("input", () => {preview.innerHTML = `<strong> ${inputt.value} </strong>`})
        // 24
        let contenidor = document.querySelector("#contenidor")
        let afl = document.querySelector("#afegir")

        afl.addEventListener("click", () => {contenidor.innerHTML += `<p>Nova línia ${new Date()} </p>`})
        // 25
        let inputv = document.querySelector("#usuari")
        let validar = document.querySelector("#validar")
        let divavi = document.querySelector("#avis")
        function error(){
            if (inputv.value.trim() ===""){
                divavi.innerHTML = `<span class="error">El camp és obligatori</span>`
            } else{
                divavi.innerHTML = `<span class="ok">Correcte</span>`
            }
        }

        validar.addEventListener("click", error)
        // 26
        let dies = ["Dilluns", "Dimarts", "Dimecres"]
        let buttondies = document.querySelector("#dies")
        let llistaordenada = document.querySelector("#llistaordenada")
        function llista(){
            let html = ""
            for(let i=0;i<dies.length;i++){
                html += `<li> ${dies[i]}</li>`
            }
            llistaordenada.innerHTML = html
        }
        buttondies.addEventListener("click", llista)
        // 27
        let productes = [["Poma", "1.2"], ["Llet", "0.9"]]
        let bototabla = document.querySelector("#productes")
        let taulaproductes = document.querySelector("#taulaproductes")
        function tabla(){
            let htmlTaula = ""
            for(let i=0;i<productes.length;i++){
                htmlTaula += `
                    <tr><td>${productes[i][0]}</td><td>${productes[i][1]}</td></tr>
                    `
            }
            taulaproductes.innerHTML = `<table>${htmlTaula}</table>`
        }
        bototabla.addEventListener("click", tabla)
        // 28
        let selectopt = document.querySelector("#opcio")
        let descripcio = document.querySelector("#descripcio")

        selectopt.addEventListener("change", () => {descripcio.innerHTML = `<h3> Títol ${selectopt.value} </h3> <p>Text ${selectopt.value}</p>`})
        // 29
        let fruta = document.querySelector("#fruta")
        let verdura = document.querySelector("#verdura")
        let leche = document.querySelector("#leche")
        let seleccionadosul = document.querySelector("#seleccionats");
        function comida(){
            let frutas = ""
            if(fruta.checked){
                frutas += `<li> ${fruta.value}</li>            `
            }
            if(verdura.checked){
                frutas += `<li> ${verdura.value}</li>            `
            }
            if(leche.checked){
                frutas += `<li> ${leche.value}</li>            `
            }
            seleccionadosul.innerHTML = frutas
        }
        fruta.addEventListener("change",comida)
        verdura.addEventListener("change",comida)
        leche.addEventListener("change",comida)
        // 30
        let incrementar = document.querySelector("#incrementar")
        let comptador = document.querySelector("#comptador")
        let n = 0
        incrementar.addEventListener("click", () =>{
            n++
            comptador.innerHTML= `Has clicat <strong> ${n} </strong> vegades`
        })
        // 31
        let tiempo = document.querySelector("#hora1")
        let parrafo = document.querySelector("#hora")

        tiempo.addEventListener("click", () =>{
            let ara = new Date()
            parrafo.innerHTML = `Són les <em> ${ara.getHours()}: ${ara.getMinutes()} </em>`
        })
        // 32
        let contingutAlternat = document.querySelector("#contingutAlternat")
        let boto4 = document.querySelector("#boto4")
        let mostrarA = true
        boto4.addEventListener("click", () =>{
            if (mostrarA === true){
                mostrarA = false
                contingutAlternat.innerHTML = "<strong>Estat B</strong>"
            } else {
                contingutAlternat.innerHTML = `<em>Estat A </em>`
                mostrarA = true
            }
        })
        // 33
        let nom3 = document.querySelector("#nom3")
        let cognom = document.querySelector("#cognom")
        let crearfitxa = document.querySelector("#crearfitxa");
        let fitxa = document.querySelector("#fitxa");
        crearfitxa.addEventListener("click", () =>{
            if (nom3.value.trim() === "" || cognom.value.trim() === ""){
                fitxa.innerHTML = `<p class="error">Omple tots els camps</p>`        
            } else {
                fitxa.innerHTML = `<h4> ${nom3.value}  ${cognom.value} </h4> <p>Afegit avui</p>`     
            }
        })
        console.log(fitxa)
        // 34
        let item = document.querySelector("#item")
        let añadir = document.querySelector("#afegir2")
        let limpiar = document.querySelector("#netejar2")
        let llistaitem = document.querySelector("#llistaitems")
        añadir.addEventListener("click",() => {
            if (item.value.trim() !== "") {
                llistaitem.innerHTML += `<li>${item.value}</li>`                
            }
            item.value = ""
        })
        limpiar.addEventListener("click", () => {
            llistaitem.textContent = ""
            item.value = ""
        })
        // 35
        let target = document.querySelector("#target")
        let buttontarget = document.querySelector("#target-button")

        buttontarget.addEventListener("click",() => {
            target.classList.add("destacat")
            target.innerHTML = `<span>Contingut Actualitzat </span>`
        })
    </script>
</body>
</html>
