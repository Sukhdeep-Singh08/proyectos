<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form  id="form1">
        <input type="text" id="noticia">
        <input type="date" id="data">
        <input type="text" id="autor">
        <input type="text" id="text">
        <button type="submit">Submit</button>
    </form>
    <div id="noticias"></div>
    <hr> 
    <form id="formtwo">
        <select  id="money">
            <option value="">Selecciona</option>
            <option value="Ingress">Ingress</option>
            <option value="Despesa">Despesa</option>
        </select>
        <input type="number" id="preu">
        <button type="submit">Submit</button>
    </form>
    <div id="llista">
        <ul id="llistaIngressos"></ul>
        <ul id="llistaDespeses"></ul>
    </div>
    <script>
        // 32
        let noticias = []
        let form1 = document.querySelector("#form1");
        let noticia = document.querySelector("#noticia")
        let data = document.querySelector("#data")
        let autor = document.querySelector("#autor")
        let text = document.querySelector("#text")
        let contenedorNoticias = document.querySelector("#noticias")

        form1.addEventListener("submit",function(e){
            e.preventDefault();
            if(noticia.value.trim() === "" || data.value.trim() === "" || autor.value.trim() === "" || text.value.trim() === ""){
                contenedorNoticias.innerHTML = `<p>Omple els camps buits</p>`
                return
            } else{
                noticias.push({titol: noticia.value, data: data.value, autor: autor.value, text: text.value})
            };
            renderitzarNoticias();
        })
        function renderitzarNoticias(){
            let html = "";
            for(let i = 0;i<noticias.length;i++){
                html += `
                <article>
                    <h3>${noticias[i].titol}</h3>
                    <p>Data: ${noticias[i].data} Autor: ${noticias[i].autor}</p>
                    <p>${noticias[i].text}</p>
                </article>`
            };
            contenedorNoticias.innerHTML = html;
        }
    // 33
        let ingressos = [];
        let despeses = [];
        let form2 = document.querySelector("#formtwo");
        let selectmoney = document.querySelector("#money")
        let listaingressos = document.querySelector("#llistaIngressos")
        let llistaDespeses = document.querySelector("#llistaDespeses")
        let preu = document.querySelector("#preu")
        form2.addEventListener("submit", function(e){e.preventDefault();
            if(selectmoney.value == "" || preu.value.trim() === ""){
                document.querySelector("#llista").textContent="Omple els camps buits";
                return
            } else if(selectmoney.value == "Ingress"){
                ingressos.push({ingress: preu.value})
            } else{
                despeses.push({despeses: preu.value})
            }

            if(ingressos.length != 0){
                renderitzarIngressos()
            }
            if(despeses.length != 0){
                renderitzarDespeses()
            }
        })

        function renderitzarIngressos(){
            let html2 = "";
            for(let i = 0;i<ingressos.length;i++){
                html2 += `<li>Concepte: ${preu.value}</li>`
            }
            listaingressos.innerHTML = html2
        }

        function renderitzarDespeses(){
            let html3 = "";
            for(let i = 0;i<ingressos.length;i++){
                html3 += `<li>Concepte: ${preu.value}</li>`
            }
            llistaDespeses.innerHTML = html3
        }
        renderitzarIngressos()
        renderitzarDespeses()
    // 34
    // 38
    // 39
    // 40
    </script>
</body>
</html>
