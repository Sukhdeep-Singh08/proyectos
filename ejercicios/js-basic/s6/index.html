<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="nom">
    <input type="number" id="edat">
    <button id="boto1">AS</button>
    <hr>
    <ul id="llista">

    </ul>
    <button id="boto2">ASDa</button>
    <hr>
    <div id="zona">

    </div>
    <hr>
    <form id="form1">
        <input type="text" #input>
        <button type="submit" id="submit">Submit</button>
    </form>
    <hr>
    <form id="form2">
        <input type="text" id="nom2">
        <input type="text" id="cognom">
        <button type="submit" id="boto3">ASDA</button>
    </form>
    <div id="llista2"></div>
    <script>
    // Level 1 - Array d'objectes i .push(0)
        // 1
        let llibre = {
            titol: "Don Quixot",
            autor: "Cervantes",
            any: "1605"
        }
        console.log(llibre.titol)
        // 2
        let llibres = [{titol: "A",autor: "X"},{titol:"B",autor:"Y"}];
        console.log(llibres[1].titol)
        console.log(llibres.length)
        // 3
        llibres.push({titol:"C",autor:"<"})
        console.log(llibres.length)
        // 4
        let nom = "anna";
        let edat = "25";
        let ciutat = "Barcelona"
        let persona = []
        persona.push({nom: nom,edat: edat,ciutat: ciutat})
        console.log(persona)
        // 5
        let inputn = document.querySelector("#nom")
        let inputd = document.querySelector("#edat")
        let button = document.querySelector("#boto1")

        button.addEventListener("click",() => {
            let p = {
                nom: inputn.value,
                edat: inputd.value
            };
            console.log(p)
        })
    // Level 2 -- Renderitzar array amb for i innerHTML
        // 6
        let fruits = ["Poma","Plàtan","Taronja"]
        for(let i=0;i<fruits.length;i++){
            console.log(fruits[i])
        }
        // 7
        let button2 = document.querySelector("#boto2")


        button2.addEventListener("click",() => {
            let html = "";
            for(let i=0;i<fruits.length;i++){
                html += `<li> ${fruits[i]} </li>`;
            }            
            document.querySelector("#llista").innerHTML = html;
        })
        // 8 - 9 - 10
        let productes = [ { nom: "Llapis", preu: 1.2 }, { nom: "Goma", preu: 0.5 } ]
        function arra(){
            let zona = document.querySelector("#zona")
            let producte = ""
            if(productes.length === 0){
                producte = `<p>No hi ha productes.</p>`
            } else {
                for(let i = 0;i<productes.length;i++){
                    producte += `<div class="producte"><strong>${productes[i].nom}</strong> - ${productes[i].preu}</div>`                         
                }
            }
            zona.innerHTML = producte
        }
        arra()
    // Level 3 - Formulari submit i preventDefault
        // 11
        let form = document.querySelector("#form1")
        let submit = document.querySelector("#submit")

        form.addEventListener("submit",function(e) {e.preventDefault(); console.log("Formulari enviat")})
        // 12
        let input2 = document.querySelector("#nom2");
        let cognom = document.querySelector("#cognom")
        let button3 = document.querySelector("#boto3")
        let persones = [];

        document.querySelector("#form2").addEventListener("submit", function(e) {e.preventDefault(); persones.push({nom: input2.value, cognom: cognom.value});renderitzarPersones(); input2.value = ""; cognom.value = ""})
        
        function renderitzarPersones(){
            let llista2 = document.querySelector("#llista2");
            let html2 = ""
            for(let i = 0; i<persones.length; i++){
                html2 += `<p>Nom : ${persones[i].nom} Cognom: ${persones[i].cognom}</p>`
            };
            llista2.innerHTML = html2
        }
    </script>
</body>
</html>
