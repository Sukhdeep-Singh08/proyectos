<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hidden{display: none;}
        .buit{color: gray; padding: 10px; border: 1px solid black;}
    </style>
</head>
<body>
    <section id="panell">Contingut</section>
    <button id="amagar">Amagar</button>
    <button id="mostrar">mostrar</button>
    <hr>
    <form action="" id="formulariNoticia" class="hidden">ASDASd</form>
    <button id="noticia">Noticia</button>
    <hr>
    <form action="" id="form3">
        <input type="text" id="tasca">
        <button type="submit" id="boto4">Cine</button>
    </form>
    <div id="tasques2"></div>
    <hr>
    <form action="" id="form4">
        <label for="">nom</label>
        <input type="text" id="nom">
        <label for="">email</label>
        <input type="email" name="" id="email">
        <label for="">telefon</label>
        <input type="tel" name="" id="telefon">
        <button type="submit" id="submit">Submit</button>
    </form>
    <hr>
    <form action="" id="noticies">
        <label for="">titol</label>
        <input type="text" id="titol">
        <label for="">text</label>
        <input type="text" id="text">
        <label for="">data</label>
        <input type="text" id="data">
        <label for="">autor</label>
        <input type="text" id="autor">
        <button type="submit" id="boto5">Submit</button>
    </form>
    <button id="newnotice" class="hidden">Nova notícia</button>
    <div id="resultado"></div>
    <div id="divErrors">asdadadada</div>
    <script>
    // Level 4 Mostrar/amagar formulari flux complet
        // 16
        let panell = document.querySelector("#panell")
        let amagar = document.querySelector("#amagar")
        let mostrar = document.querySelector("#mostrar")

        amagar.addEventListener("click",() => {
            panell.classList.add("hidden")
        })

        mostrar.addEventListener("click", () => {
            panell.classList.remove("hidden")
        })
        // 17
        document.querySelector("#noticia").addEventListener("click",() => {
            document.querySelector("#formulariNoticia").classList.remove("hidden")
        })
        // 18

        let tasques = []
        let form3 = document.querySelector("#form3")
        let tasca = document.querySelector("#tasca")
        let boto4 = document.querySelector("#boto4")
        let tasques2 = document.querySelector("#tasques2")

        form3.addEventListener("submit", function(e) {
            e.preventDefault();
            if (tasca.value.trim() === ""){alert("Omple els camps buits"); return} else{ tasques.push({titol: tasca.value, completada: false})};
            creadorTasques();
            form3.reset()
            form3.classList.add("hidden");
        })

        function creadorTasques(){
            let html3 = "";
            for(let i = 0; i <tasques.length; i++){
                html3 += `<li>${tasques[i].titol}</li>`
            }
            tasques2.innerHTML = `<ul>${html3}</ul>`
        }  
        // 19
        let contactes = []
        let nom = document.querySelector("#nom")
        let form4 = document.querySelector("#form4")
        let email = document.querySelector("#email")
        let telefon = document.querySelector("#telefon")
        let resultado = document.querySelector("#resultado")
        form4.addEventListener("submit",function(e){
            e.preventDefault();
            if (nom.value.trim() === "" || email.value.trim() === "" || telefon.value.trim() === ""){
                alert("Omple els camps buits");
                return;
            } else{
                contactes.push({nom: nom.value, email: email.value, telefon: telefon.value});
            };
            llistaArticles();
            form4.reset();
            form4.classList.add("hidden");
        })

        function llistaArticles(){
            let html4 = "";
            for(let i=0;i<contactes.length;i++){
                html4 += `
                <p>Nom: ${contactes[i].nom}</p>
                <p>Email: ${contactes[i].email}</p> <p>Telefon: ${contactes[i].telefon}</p>
                `;          
            };
            resultado.innerHTML = `<div>${html4}</div>`;
        }
        // 20 - 22 - 23 - 28 - 31
        let noticia = []
        let noticies = document.querySelector("#noticies")
        let titolt = document.querySelector("#titol")
        let text = document.querySelector("#text")
        let data = document.querySelector("#data")
        let autor = document.querySelector("#autor")

        noticies.addEventListener("submit", function(e){
            e.preventDefault();
            if (titolt.value.trim() === "" || text.value.trim() === "" || data.value.trim() === "" || autor.value.trim() === ""){
                alert("Omple els camps buits")
                return
            } else {
                noticia.push({titol: titolt.value,text:text.value,data:data.value,autor:autor.value})
            }
            renderitzarNoticies()
            noticies.reset()
            noticies.classList.add("hidden")
            document.querySelector("#newnotice").classList.remove("hidden")
        })
        function renderitzarNoticies(){
            let html5 = "";
            if(noticia.length === 0){
                html5 = `<p class="buit">No hi ha elements.Afegeix-ne desde del formulari</p>`
            } else {
                for (let i = 0; i< noticia.length; i++) {
                    html5 += `<article><p>Titol: ${noticia[i].titol}</p>
                    <p>Text: ${noticia[i].text}</p>
                    <p>Data: ${noticia[i].data}</p>
                    <p>Autor: ${noticia[i].autor}</p></article>`
                }                
            }
            resultado.innerHTML = html5
        }

        document.querySelector("#newnotice").addEventListener("click", () => {
            document.querySelector("#divErrors").innerHTML = ""
            noticies.reset()
            if(noticies.classList.contains("hidden")){
                noticies.classList.remove("hidden")
            } else {
                noticies.classList.add("hidden")
            }
        })

        renderitzarNoticies()
    </script>
</body>
</html>
