<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        .vermell {
            color: red;
        }

    </style>
</head>
<body>
    <p><strong>Nivell 1 — Selectors i lectura</strong></p>
    <p id="salut">Hola</p>
    <span class="destacat">Text</span>
    <input id="nom" type="text" value="Pep">
    <select name="" id="ciutat">
        <option value="Barcelona">Barcelona</option>
        <option value="Girona">Girona</option>
        <option value="Lleida">Lleida</option>
        <option value="Tarragona">Tarragona</option>
    </select>
    <input type="checkbox" id="accepto">

    <p><strong>Nivell 2 — Listeners i canvis bàsics</strong></p>
    <button id="boto1">Boton</button>
    <p id="missatge">Experant clic...</p>
    <button id="botop">Boton2</button>
    <div id="zona" style="background-color: yellow; width: 250px; height: 100px;"></div>
    <button id="boto3">Boton3</button>
    <input type="text" id="entrada">
    <p id="sortida">-</p>
    <input type="text" id="camp">
    <button id="boto4">boto4</button>

    <p><strong>Nivell 3 — classList</strong></p>
    <p id="paragraf">Text</p>
    <button id="boto5">boto5</button>
    <button id="boto6">boto6</button>
    <button id="boto7">Alternar-color</button>
    <script>
        // Level 1----------
        let salut = document.querySelector("#salut")
        console.log(salut.textContent)

        let destacat = document.querySelector(".destacat")
        console.log(destacat)

        console.log(document.querySelector("#nom").value)
    
        let select = document.querySelector("#ciutat")
        console.log(select.value)

        console.log(document.querySelector("#accepto").checked)

        // Level 2-----------
        document.querySelector("#boto1").addEventListener("click",function() {console.log("Clic Rebut!")})

        document.querySelector("#botop").addEventListener("click", function () {document.querySelector("#missatge").textContent ="Has fet clic!"})

        let zona = document.querySelector("#zona")
        document.querySelector("#boto3").addEventListener("click", () => {zona.innerHTML = "<strong>Contingut nou</strong>"})

        let entrada = document.querySelector("#entrada")
        let sortida = document.querySelector("#sortida")
        entrada.addEventListener("input", () => {sortida.textContent = entrada.value})

        let camp = document.querySelector("#camp")
        let boto4 = document.querySelector("#boto4") 
        boto4.addEventListener("click", () => {camp.value = "Text Introduït per JS"})

        // Level 3--------
        let paragraf = document.querySelector("#paragraf")
        document.querySelector("#boto5").addEventListener("click", () => {paragraf.classList.add("vermell")})

        document.querySelector("#boto6").addEventListener("click", () => {paragraf.classList.remove("vermell")})

        // document.querySelector("#boto7").addEventListener("click", () => {paragraf.classList.toggle("vermell")})

        function cambiar() {
            if (paragraf.classList.contains("vermell")) {
                paragraf.classList.remove("vermell")
            } else {
                paragraf.classList.add("vermell")
            }
        }

        document.querySelector("#boto7").addEventListener("click", cambiar)

    </script>
</body>
</html>
